name: CI

# Triggers: pull requests, release tags, and manual runs. Deliberately NOT
# per-push: a push trigger on macOS runners (10x minute multiplier) burned 90%
# of the month's minutes in two days (2026-09-02); the local gate
# (scratchpad/merge_branch.sh: release build with -warnings-as-errors + full
# test suite before every push) covers main. A TAG is the exception worth
# paying for - it is the public, citable artifact Homebrew fetches, it cannot
# be fixed by a force-push, and one run per release is a handful of minutes a
# month.
on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # The one mechanical guard against a test that drives the user's real
      # Logic Pro. The suite must stay hermetic: no live probes, no reaching
      # for the running application, no environment-gated escape hatch.
      - name: No live probes in the test suite
        run: |
          if grep -rnE "LOGICIAN_LIVE|LiveProbe|NSWorkspace|ProcessInfo\.processInfo\.environment" Tests/; then
            echo "::error::A test reaches for live state. Tests must not touch a running Logic Pro."
            exit 1
          fi

      - name: Build (release, warnings are errors)
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test
